# Append to sshd_config after global settings; validate with sshd -t before reload.
Match User savsoul-deploy
    AuthorizedKeysFile /etc/ssh/savsoul-deploy.keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    ForceCommand /usr/bin/python3 -I /usr/local/lib/savsoul-release/deploy_ssh.py
    AllowTcpForwarding no
    # Production OpenSSH 6.6.1 has no Unix-socket forwarding or this directive.
    # When upgrading to OpenSSH >= 6.7, enable before reloading sshd:
    # AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
