<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	ServerName www.savsoul.com
	ServerAlias savsoul.com

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/savsoul_com.crt
	SSLCertificateKeyFile /etc/apache2/certs/savsoul.key
    SSLCertificateChainFile /etc/apache2/certs/savsoul_com.ca-bundle
	DocumentRoot /var/www/lpmud
	<Directory />
		Options FollowSymLinks
		AllowOverride None
	</Directory>
	<Directory /var/www/>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride None
		Order allow,deny
		allow from all
	</Directory>

	ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
	<Directory "/usr/lib/cgi-bin">
		AllowOverride None
		Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
		Order allow,deny
		Allow from all
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log

	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn

	CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias /doc/ "/usr/share/doc/"
    <Directory "/usr/share/doc/">
        Options Indexes MultiViews FollowSymLinks
        AllowOverride None
        Order deny,allow
        Deny from all
        Allow from 127.0.0.0/255.0.0.0 ::1/128
    </Directory>

    # Savage Soul browser terminal (fixed local upstream).
    ProxyRequests Off
    ProxyPreserveHost On
    # The bridge trusts only mod_proxy's final appended client-address hop.
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Savsoul-Client-IP early
    ProxyPass "/mud-websocket" "ws://127.0.0.1:4086/mud-websocket" retry=0 timeout=3600
    <Location "/playnow.html">
        Header set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://savsoul.com wss://www.savsoul.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
        Header set Referrer-Policy "same-origin"
        Header set X-Content-Type-Options "nosniff"
        Header set Cache-Control "no-cache"
    </Location>
</VirtualHost>
