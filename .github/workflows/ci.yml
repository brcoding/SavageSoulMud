name: CI and production release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate semantic commits and calculate game version
        id: identity
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 tools/server-host/build_version.py --pr "$PR_NUMBER" --base "$PR_BASE"
          else
            python3 tools/server-host/build_version.py
          fi
      - name: Version history regression checks
        run: python3 -m unittest discover -s tools/server-host -p test_build_version.py
      - name: Kubernetes staging tool checks
        run: |
          python3 -m unittest discover -s tools/kubernetes -p 'test_*.py'
          python3 tools/kubernetes/render.py
          git diff --exit-code -- deploy/kubernetes/stack.json
  build:
    needs: version
    env:
      SAVSOUL_VERSION: ${{ needs.version.outputs.version }}
      SAVSOUL_REVISION: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Character rules and structured sign-in
        run: |
          cargo test --locked -p example-mud --lib savage_rules
          cargo test --locked -p grim-auth --lib structured_login
      - name: Check website sources
        run: python3 website/build.py
      - name: Release preservation and validation checks
        run: python3 -m unittest discover -s tools/server-host -p test_release.py
  quality:
    needs: version
    env:
      SAVSOUL_VERSION: ${{ needs.version.outputs.version }}
      SAVSOUL_REVISION: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: make lint
      - name: Workspace tests
        if: ${{ !cancelled() }}
        run: make test
  package:
    needs: version
    env:
      SAVSOUL_VERSION: ${{ needs.version.outputs.version }}
      SAVSOUL_REVISION: ${{ needs.version.outputs.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install static linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install target for the repository's pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl
      - name: Build compatible server executable
        run: cargo build --locked --release -p example-mud --bin savsoul --target x86_64-unknown-linux-musl
      - name: Verify static linking
        run: |
          test "$(target/x86_64-unknown-linux-musl/release/savsoul --version)" = "$SAVSOUL_VERSION (${SAVSOUL_REVISION:0:12})"
          file target/x86_64-unknown-linux-musl/release/savsoul
          readelf -l target/x86_64-unknown-linux-musl/release/savsoul > program-headers.txt
          ! grep -q INTERP program-headers.txt
      - name: Package code and authored content
        run: |
          python3 website/build.py
          python3 tools/server-host/package_release.py \
            --binary target/x86_64-unknown-linux-musl/release/savsoul \
            --revision "$SAVSOUL_REVISION" --version "$SAVSOUL_VERSION" --output release.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: [version, build, quality, package]
    if: github.repository == 'brcoding/SavageSoulMud' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://savsoul.com
    concurrency:
      group: savsoul-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ github.sha }}
      - name: Deploy the checked revision over restricted SSH
        env:
          DEPLOY_KEY: ${{ secrets.SAVSOUL_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SAVSOUL_KNOWN_HOSTS }}
          SAVSOUL_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/brcoding/SavageSoulMud.git refs/heads/main | cut -f1)" = "$GITHUB_SHA" || {
            echo 'A newer main revision exists; refusing an out-of-order release.' >&2; exit 1;
          }
          umask 077
          install -d -m 700 "$RUNNER_TEMP/deploy-ssh"
          trap 'rm -f "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          ssh -T -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            savsoul-deploy@173.255.210.234 "deploy $GITHUB_SHA" < release.tar.gz
          printf 'Released `%s` (`%s`) to https://savsoul.com (game :4000 / TLS :4001).\n' "$SAVSOUL_VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
